[package]
name = "pzzacode"
version = "0.2.17"
description = "PzzaCode - a grid terminal manager for agentic coding"
authors = ["pzzaworks"]
edition = "2021"

[lib]
name = "pzzacode_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.9"
base64 = "0.22"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
