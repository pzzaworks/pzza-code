[package]
name = "pzza-console"
version = "0.1.0"
description = "Terminal-first grid console for the pzzaworks devbox"
authors = ["pzzaworks"]
edition = "2021"

[lib]
name = "pzza_console_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.9"
base64 = "0.22"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
