[package]
name = "pzzacode"
version = "0.2.37"
description = "PzzaCode - every terminal, every agent, one grid"
authors = ["Berke (pzzaworks)"]
edition = "2021"

[lib]
name = "pzzacode_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.9"
tauri-plugin-updater = "2"
tauri-plugin-notification = "2"

reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
sha2 = "0.10"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
coreaudio-rs = { version = "=0.13.0", default-features = false, features = ["audio_unit"] }
objc2-core-audio = { version = "0.3", default-features = false, features = ["std", "AudioHardware"] }
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFString"] }
whisper-rs = { version = "=0.16.0", features = ["metal"] }

[[test]]
name = "native_terminal_drop"
path = "tests/native_terminal_drop.rs"
harness = false

[[test]]
name = "native_shutdown"
path = "tests/native_shutdown.rs"
harness = false

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
